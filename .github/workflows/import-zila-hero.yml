name: Import ZILA editorial hero

on:
  push:
    branches:
      - fix/editorial-hero
    paths:
      - .github/workflows/import-zila-hero.yml

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/editorial-hero
          fetch-depth: 0

      - name: Download Winter Attitude creative
        env:
          HERO_URL: "https://scontent-fra3-1.xx.fbcdn.net/v/t45.1600-4/760527350_2472959333191530_5619511063735950638_n.jpg?_nc_cat=103&ccb=1-7&_nc_sid=d5bd00&_nc_ohc=AOyUjyD-g2gQ7kNvwHvHNlp&_nc_oc=AdruwdV8SWG-yvCJpyxSI55RL1B_xKWkRZYXZg-TqVq_8JDs1-1v3hnG-jIcP1yz9Mc&_nc_zt=1&_nc_ht=scontent-fra3-1.xx&edm=AEuWsiQEAAAA&_nc_gid=sxxngzJkb_RWox4cO3RRTg&_nc_tpa=Q5bMBQJMYgVTkCigAW_ZcfQw_rPFoUult7K5LAfTqSImmgtxws9rcpcsBJ1zwT1WeUT9s0q0VcIfdvjXMw&oh=00_AQEWIs-COF0aQFBFbhidWqcAYTsF1JQrsqDZeeo46N4--A&oe=6A8CEFFC"
        run: |
          curl --fail --location --retry 3 "$HERO_URL" --output hero-zila-lifestyle.jpg
          test -s hero-zila-lifestyle.jpg
          test "$(stat -c%s hero-zila-lifestyle.jpg)" -gt 10000
          file hero-zila-lifestyle.jpg | grep -qi "JPEG image data"

      - name: Commit hero asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- hero-zila-lifestyle.jpg
          git diff --cached --quiet || git commit -m "fix: add Winter Attitude editorial hero"
          git push origin HEAD:fix/editorial-hero
